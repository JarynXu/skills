<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 420"
     width="800"
     height="420"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">可靠的 SVG 布局示例</title>
  <desc id="svg-desc">三个等间距节点通过不穿过节点的箭头连接。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#365EAA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#F7F8FA"/>

  <g id="connectors" fill="none" stroke="#365EAA" stroke-width="3">
    <path d="M 248 210 H 310" marker-end="url(#arrow)"/>
    <path d="M 490 210 H 552" marker-end="url(#arrow)"/>
  </g>

  <g id="nodes"
     font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(68 150)">
      <rect x="0" y="0" width="180" height="120" rx="16" fill="#FFFFFF" stroke="#A9B8D8" stroke-width="2"/>
      <text x="90" y="60" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1F2937">输入</text>
    </g>
    <g transform="translate(310 150)">
      <rect x="0" y="0" width="180" height="120" rx="16" fill="#EAF0FF" stroke="#365EAA" stroke-width="2"/>
      <text x="90" y="60" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1F2937">处理</text>
    </g>
    <g transform="translate(552 150)">
      <rect x="0" y="0" width="180" height="120" rx="16" fill="#FFFFFF" stroke="#A9B8D8" stroke-width="2"/>
      <text x="90" y="60" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1F2937">输出</text>
    </g>
  </g>
</svg>
