name: Build Project Manager offline library

on:
  push:
    branches:
      - project-manager-library-rebuild
    paths:
      - "skills/project-manager/references/library/SOURCES.json"
      - "skills/project-manager/scripts/sync_project_library.py"
      - "skills/project-manager/scripts/sync_offline_library_core.py"
      - "skills/project-manager/scripts/offline_library.py"
      - "skills/project-manager/scripts/offline_library_core.py"
      - ".github/workflows/sync-project-manager-library.yml"
  workflow_dispatch:
    inputs:
      source_ids:
        description: "Optional space- or comma-separated source ids; empty syncs the full catalog"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: project-manager-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preprocessing dependencies
        run: python -m pip install pypdf beautifulsoup4 markdownify docutils

      - name: Validate catalog before network access
        run: |
          python skills/project-manager/scripts/sync_project_library.py --print-catalog >/dev/null
          count="$(python skills/project-manager/scripts/sync_project_library.py --list-source-ids | wc -l)"
          test "$count" -eq 7

      - name: Synchronize, preprocess, and verify
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${SOURCE_IDS//,/ }"
          if [[ -n "${requested// /}" ]]; then
            read -r -a sources <<< "$requested"
          else
            mapfile -t sources < <(python skills/project-manager/scripts/sync_project_library.py --list-source-ids)
          fi
          for source in "${sources[@]}"; do
            echo "=== syncing ${source} ==="
            python skills/project-manager/scripts/sync_project_library.py --source "$source"
          done
          python skills/project-manager/scripts/sync_project_library.py --process-existing
          python skills/project-manager/scripts/offline_library.py verify
          bash skills/project-manager/tests/test.sh

      - name: Commit verified project-management library atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f \
            skills/project-manager/references/library/originals \
            skills/project-manager/references/library/processed \
            skills/project-manager/references/library/SOURCES.lock.json
          if git diff --cached --quiet; then
            echo "Project Manager offline library is already current."
            exit 0
          fi
          git commit -m "chore(project-manager): sync verified offline library"
          git push origin "HEAD:${GITHUB_REF_NAME}"
