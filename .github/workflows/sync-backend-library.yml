name: Sync backend offline library

on:
  push:
    branches: [backend-library-rebuild]
    paths:
      - "skills/backend-engineer/references/library/SOURCES.json"
      - "skills/backend-engineer/scripts/sync_offline_library.py"
      - ".github/workflows/sync-backend-library.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF extraction support
        run: python -m pip install pypdf

      - name: Synchronize pinned upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python skills/backend-engineer/scripts/sync_offline_library.py

      - name: Verify byte-exact offline library
        run: python skills/backend-engineer/scripts/offline_library.py verify

      - name: Commit verified offline library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/backend-engineer/references/library/originals \
            skills/backend-engineer/references/library/SOURCES.lock.json
          if git diff --cached --quiet; then
            echo "Offline library is already current."
          else
            git commit -m "chore(backend-engineer): sync teaching library originals"
            git push origin HEAD:backend-library-rebuild
          fi

      - name: Run backend-engineer teaching tests
        run: bash skills/backend-engineer/tests/test.sh
