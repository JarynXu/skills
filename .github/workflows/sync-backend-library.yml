name: Sync backend offline library

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: "Optional space- or comma-separated source ids; empty syncs every catalog source"
        required: false
        type: string
  push:
    branches:
      - backend-engineer-framework-library-rebuild
    paths:
      - .github/workflows/sync-backend-library.yml
      - skills/backend-engineer/references/library/sources.d/framework-canon.json
      - skills/backend-engineer/tests/test_framework_canon.py

permissions:
  contents: write

concurrency:
  group: backend-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preprocessing dependencies
        run: python -m pip install pypdf beautifulsoup4 markdownify docutils

      - name: Synchronize, preprocess, and verify
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python skills/backend-engineer/tests/test_framework_canon.py

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested="quarkus-core-docs micronaut-core-docs ktor-server-docs fastify-core-docs nestjs-core-docs gin-core-docs tokio-guides sqlalchemy-core-docs efcore-core-docs celery-core-docs"
          else
            requested="${SOURCE_IDS//,/ }"
          fi

          if [[ -n "${requested// /}" ]]; then
            read -r -a sources <<< "$requested"
          else
            mapfile -t sources < <(python skills/backend-engineer/scripts/sync_library_catalogs.py --list-source-ids)
          fi

          for source in "${sources[@]}"; do
            echo "=== syncing ${source} ==="
            python skills/backend-engineer/scripts/sync_library_catalogs.py --source "$source"
          done

          python skills/backend-engineer/scripts/prune_offline_library.py
          python skills/backend-engineer/scripts/sync_library_catalogs.py --process-existing
          python skills/backend-engineer/scripts/offline_library.py verify
          bash skills/backend-engineer/tests/test.sh

      - name: Commit verified library atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f \
            skills/backend-engineer/references/library/originals \
            skills/backend-engineer/references/library/processed \
            skills/backend-engineer/references/library/SOURCES.lock.json

          if git diff --cached --quiet; then
            echo "Offline library is already current."
            exit 0
          fi

          git commit -m "chore(backend-engineer): sync verified offline library"
          git push origin "HEAD:${GITHUB_REF_NAME}"
