name: Sync backend offline library

on:
  push:
    branches: [backend-library-rebuild]
    paths:
      - "skills/backend-engineer/references/library/SOURCES.json"
      - "skills/backend-engineer/scripts/sync_offline_library.py"
      - ".github/workflows/sync-backend-library.yml"
  workflow_dispatch:
    inputs:
      source_ids:
        description: "Optional space- or comma-separated source ids; empty syncs all sources"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: backend-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preprocessing dependencies
        run: python -m pip install pypdf beautifulsoup4 markdownify docutils

      - name: Select source packs that need synchronization
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_SOURCES: ${{ inputs.source_ids }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          catalog_path = Path("skills/backend-engineer/references/library/SOURCES.json")
          originals = Path("skills/backend-engineer/references/library/originals")
          sync_path = "skills/backend-engineer/scripts/sync_offline_library.py"
          workflow_path = ".github/workflows/sync-backend-library.yml"

          current = json.loads(catalog_path.read_text(encoding="utf-8"))
          current_by_id = {item["source_id"]: item for item in current["sources"]}
          selected: list[str] = []
          removed: list[str] = []

          def add(source_id: str) -> None:
              if source_id in current_by_id and source_id not in selected:
                  selected.append(source_id)

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              raw = os.environ.get("MANUAL_SOURCES", "").strip()
              if raw:
                  requested = [item for item in re.split(r"[\s,]+", raw) if item]
                  unknown = sorted(set(requested) - set(current_by_id))
                  if unknown:
                      raise SystemExit(f"unknown source ids: {', '.join(unknown)}")
                  for source_id in requested:
                      add(source_id)
              else:
                  for source_id in current_by_id:
                      add(source_id)
          else:
              before = os.environ.get("BEFORE_SHA", "")
              previous_by_id = {}
              changed_files: list[str] = []
              if before and set(before) != {"0"}:
                  changed_files = subprocess.check_output(
                      ["git", "diff", "--name-only", before, "HEAD"], text=True
                  ).splitlines()
                  try:
                      previous_text = subprocess.check_output(
                          ["git", "show", f"{before}:{catalog_path.as_posix()}"],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      )
                      previous = json.loads(previous_text)
                      previous_by_id = {item["source_id"]: item for item in previous["sources"]}
                  except (subprocess.CalledProcessError, json.JSONDecodeError, KeyError):
                      previous_by_id = {}

              for source_id, source in current_by_id.items():
                  if previous_by_id.get(source_id) != source:
                      add(source_id)
              removed = sorted(set(previous_by_id) - set(current_by_id))

              # A synchronizer change can alter recursive curation semantics. Rebuild only
              # source packs that actually use recursive includes, not the whole library.
              if sync_path in changed_files:
                  for source_id, source in current_by_id.items():
                      if any(bool(item.get("recursive")) for item in source.get("includes", [])):
                          add(source_id)

              # A workflow-only change does not by itself require network synchronization.
              if workflow_path in changed_files and len(changed_files) == 1:
                  selected = []

          # Repair incomplete historical packs. A SOURCE.json that names an original not
          # present in Git is not a valid offline source and must be rebuilt from upstream.
          for source_id in current_by_id:
              manifest_path = originals / source_id / "SOURCE.json"
              if not manifest_path.is_file():
                  add(source_id)
                  continue
              try:
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  add(source_id)
                  continue
              for item in manifest.get("files", []):
                  if not isinstance(item, dict):
                      continue
                  rel = item.get("local_path") or item.get("upstream_path")
                  if isinstance(rel, str) and not (manifest_path.parent / rel).is_file():
                      add(source_id)
                      break

          print("changed=" + " ".join(selected))
          print("removed=" + " ".join(removed))
          PY

      - name: Remove deleted source packs
        if: steps.select.outputs.removed != ''
        env:
          REMOVED: ${{ steps.select.outputs.removed }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("skills/backend-engineer/references/library")
          removed = os.environ["REMOVED"].split()
          for source_id in removed:
              shutil.rmtree(root / "originals" / source_id, ignore_errors=True)
              shutil.rmtree(root / "processed" / source_id, ignore_errors=True)

          lock_path = root / "SOURCES.lock.json"
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              for source_id in removed:
                  lock.get("sources", {}).pop(source_id, None)
              lock_path.write_text(
                  json.dumps(lock, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Synchronize selected source packs
        if: steps.select.outputs.changed != ''
        env:
          CHANGED: ${{ steps.select.outputs.changed }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for source in $CHANGED; do
            echo "=== syncing ${source} ==="
            python skills/backend-engineer/scripts/sync_offline_library.py --source "${source}"

            git add -A -f \
              "skills/backend-engineer/references/library/originals/${source}" \
              "skills/backend-engineer/references/library/processed/${source}" \
              skills/backend-engineer/references/library/SOURCES.lock.json

            if git diff --cached --quiet; then
              echo "${source}: already current"
            else
              git commit -m "chore(backend-engineer): sync ${source} teaching source"
              git push origin HEAD:backend-library-rebuild
            fi
          done

      - name: Build processed Markdown from all installed originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python skills/backend-engineer/scripts/sync_offline_library.py --process-existing
          git add -A -f \
            skills/backend-engineer/references/library/originals/*/SOURCE.json \
            skills/backend-engineer/references/library/processed \
            skills/backend-engineer/references/library/SOURCES.lock.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(backend-engineer): build processed Markdown teaching layer"
            git push origin HEAD:backend-library-rebuild
          fi

      - name: Commit removed source packs
        if: steps.select.outputs.removed != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f \
            skills/backend-engineer/references/library/originals \
            skills/backend-engineer/references/library/processed \
            skills/backend-engineer/references/library/SOURCES.lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(backend-engineer): remove deleted teaching sources"
            git push origin HEAD:backend-library-rebuild
          fi

      - name: Verify complete offline library
        run: python skills/backend-engineer/scripts/offline_library.py verify

      - name: Run backend-engineer teaching tests
        run: bash skills/backend-engineer/tests/test.sh
